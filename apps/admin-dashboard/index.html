<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASINO ADMIN</title>
  </head>

  <body>
    <div id="root"></div>

    <script>
      (function(){
        try {
          if (!window.__API_BASE) {
            var ls = (typeof localStorage !== 'undefined') ? localStorage.getItem('__API_BASE') : null;
            window.__API_BASE = (ls && ls.trim()) || 'https://api.cuocbong99.live/api';
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
