# 87app — Frontend (static dist) + Admin (PM2 serve :8781 qua Nginx) + API (PM2 :8701)

# Frontend
server {
    listen 80;
    listen [::]:80;
    server_name cuocbong99.live www.cuocbong99.live;

    root /var/87app/frontend1/dist;
    index index.html;

    access_log /var/log/nginx/87app-frontend.access.log;
    error_log  /var/log/nginx/87app-frontend.error.log;

    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SPA: fallback index.html. KHÔNG cache index để release mới được nhận ngay.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Asset hash từ Vite: cache lâu, hash đã đảm bảo bust.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8701/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    include /var/87app/deploy/nginx/snippets/socket-io-proxy.conf;
}

# Admin — HTML/JS/CSS do PM2 `vite preview` :8781; API → backend :8701 (MongoDB trong backend .env)
server {
    listen 80;
    listen [::]:80;
    server_name admin.cuocbong99.live www.admin.cuocbong99.live;

    access_log /var/log/nginx/87app-admin.access.log;
    error_log  /var/log/nginx/87app-admin.error.log;

    client_max_body_size 32M;

    location /api/ {
        proxy_pass http://127.0.0.1:8701/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API subdomain
server {
    listen 80;
    listen [::]:80;
    server_name api.cuocbong99.live;

    access_log /var/log/nginx/87app-api.access.log;
    error_log  /var/log/nginx/87app-api.error.log;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    include /var/87app/deploy/nginx/snippets/socket-io-proxy.conf;
}
