# Tham chiếu / bản sao kiểu "full PM2 SPA" (FE :8780, admin :8781, API :8701).
# Khuyến nghị dùng file chuẩn trong repo: deploy/nginx/87app-pm2.conf + symlink sites-enabled/87app.conf
# (deploy.sh mặc định dùng deploy/nginx/87app.conf = static dist, không proxy :8780).
# Site: cuocbong99.live -> PM2 Frontend1 (8780)
server {
    listen 80;
    listen [::]:80;
    server_name cuocbong99.live www.cuocbong99.live;

    access_log /var/log/nginx/cuocbong99.access.log;
    error_log  /var/log/nginx/cuocbong99.error.log;

    client_max_body_size 32M;

    location /api/ {
        proxy_pass http://127.0.0.1:8701/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8701;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve frontend1 application (PM2 serve :8780)
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

