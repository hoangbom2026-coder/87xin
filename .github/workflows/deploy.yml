name: Production Deploy CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'infra/ecosystem.production.cjs'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build --workspace=apps/backend

      - name: Build frontend-web
        run: npm run build --workspace=apps/frontend-web

      - name: Build admin-dashboard
        run: npm run build --workspace=apps/admin-dashboard

      - name: Prepare build artifact structure
        run: |
          mkdir -p build-artifact/apps/backend
          mkdir -p build-artifact/apps/frontend-web
          mkdir -p build-artifact/apps/admin-dashboard
          mkdir -p build-artifact/infra

          cp -r apps/backend/dist build-artifact/apps/backend/
          cp apps/backend/package.json build-artifact/apps/backend/
          cp -r apps/frontend-web/dist build-artifact/apps/frontend-web/
          cp -r apps/admin-dashboard/dist build-artifact/apps/admin-dashboard/
          cp infra/ecosystem.production.cjs build-artifact/infra/
          cp package.json build-artifact/
          cp package-lock.json build-artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-artifact/
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'hermes' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: /var/app/game
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $VPS_PORT -H $VPS_HOST >> ~/.ssh/known_hosts

      - name: Rsync build artifacts to VPS
        run: |
          rsync -avz -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            --delete \
            ./apps/backend/dist/ $VPS_USER@$VPS_HOST:$DEPLOY_PATH/apps/backend/dist/

          rsync -avz -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            --delete \
            ./apps/frontend-web/dist/ $VPS_USER@$VPS_HOST:$DEPLOY_PATH/apps/frontend-web/dist/

          rsync -avz -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            --delete \
            ./apps/admin-dashboard/dist/ $VPS_USER@$VPS_HOST:$DEPLOY_PATH/apps/admin-dashboard/dist/

          rsync -avz -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
            ./infra/ecosystem.production.cjs $VPS_USER@$VPS_HOST:$DEPLOY_PATH/infra/ecosystem.production.cjs

      - name: Reload PM2 processes & Zero-downtime healthcheck
        run: |
          ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "bash -s" << 'EOF'
            set -e

            echo "==> Reloading PM2 backend API (tc-api)..."
            pm2 reload tc-api --update-env || pm2 start /var/app/game/infra/ecosystem.production.cjs --only tc-api

            echo "==> Reloading PM2 admin dashboard preview (tc-admin)..."
            pm2 reload tc-admin --update-env || pm2 start /var/app/game/infra/ecosystem.production.cjs --only tc-admin

            echo "==> Verifying API healthcheck..."
            for i in 1 2 3; do
              if curl -sf http://127.0.0.1:8701/health; then
                echo " Health check passed on attempt $i"
                exit 0
              fi
              echo " Attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo " Health check failed after 3 attempts"
            exit 1
          EOF
