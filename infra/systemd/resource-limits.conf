# TC-Gaming — Resource Limits dropin for systemd services
# Áp dụng cho các service TC-Gaming (tc-api, tc-admin)
#
# Cách dùng:
#   mkdir -p /etc/systemd/system/tc-api.service.d/
#   cp resource-limits.conf /etc/systemd/system/tc-api.service.d/
#   systemctl daemon-reload
#   systemctl restart tc-api
#
# Hoặc để áp dụng toàn bộ hệ thống (DefaultLimitNOFILE trong /etc/systemd/system.conf):
#   sudo cp resource-limits.conf /etc/systemd/system.conf.d/tc-gaming-limits.conf

[Service]
# File descriptors: đủ cho Express connections, MongoDB connections, file uploads
# Mặc định Linux thường là 1024 — quá thấp cho production Node.js
LimitNOFILE=65536

# Max số process/thread: đủ cho Node.js worker threads + child processes
# Tránh fork bomb vô tình làm VPS crash
LimitNPROC=4096

# Stack size: 8MB (mặc định) là ổn cho Node.js
# Không cần thay đổi trừ khi có stack overflow
# LimitSTACK=8388608

# Core dump: tắt trên production (tránh lộ memory chứa secrets)
LimitCORE=0
