# =============================================================================
# nginx-vps-full.conf — Cấu hình Nginx tổng hợp cho 1 VPS chạy cả 2 dự án
# VPS: 4 CPU / 8 GB RAM
#
# Ánh xạ port thực tế:
#   tc-gaming.live (Game 1)
#     tc-api        → 127.0.0.1:8701  (PM2: tc-api)
#     tc-admin SPA  → 127.0.0.1:8781  (PM2: tc-admin)
#
#   MarinaBaySands (Game 2) — IP: 159.223.81.157
#     mbs-backend   → 127.0.0.1:5000  (PM2: mbs-backend)
#     mbs-frontend  → 127.0.0.1:5001  (PM2: mbs-frontend, serve -s dist)
#     mbs-admin     → 127.0.0.1:5002  (PM2: mbs-admin,    serve -s dist)
#     deploy-hook   → 127.0.0.1:9001  (PM2: mbs-deploy-hook)
#
# Triển khai:
#   sudo ln -sf /var/app/game/infra/nginx/nginx-vps-full.conf \
#               /etc/nginx/sites-available/vps-full
#   sudo ln -sf /etc/nginx/sites-available/vps-full \
#               /etc/nginx/sites-enabled/vps-full
#   # Xóa default nếu còn
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo nginx -s reload
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limit zones — khai báo 1 lần, dùng chung cho cả 2 project
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr  zone=api_limit:10m      rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=general_limit:10m  rate=60r/s;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ---------------------------------------------------------------------------
# Upstreams — tc-gaming.live (Game 1)
# ---------------------------------------------------------------------------
upstream tc_api {
    server 127.0.0.1:8701;
    keepalive 16;
}

upstream tc_admin_spa {
    server 127.0.0.1:8781;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# Upstreams — MarinaBaySands (Game 2)
# ---------------------------------------------------------------------------
upstream mbs_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

upstream mbs_frontend {
    server 127.0.0.1:5001;
    keepalive 8;
}

upstream mbs_admin {
    server 127.0.0.1:5002;
    keepalive 8;
}

# ===========================================================================
# ██████████  TC-GAMING.LIVE  ████████████████████████████████████████████████
# ===========================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect — tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tc-gaming.live www.tc-gaming.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Frontend Player App — tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tc-gaming.live www.tc-gaming.live;

    ssl_certificate     /etc/letsencrypt/live/tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-gaming.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_TC:10m;
    ssl_session_timeout 1d;

    root  /var/app/game/apps/frontend-web/dist;
    index index.html;

    access_log /var/app/game/infra/logs/tc-gaming-frontend.access.log combined buffer=32k flush=5s;
    error_log  /var/app/game/infra/logs/tc-gaming-frontend.error.log warn;

    limit_conn conn_limit 30;
    limit_req  zone=general_limit burst=80 nodelay;

    client_max_body_size  32M;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-XSS-Protection       "1; mode=block"                always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=()"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA routing
    location / {
        limit_req zone=general_limit burst=80 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # index.html không cache
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets — cache 1 năm
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        log_not_found off;
        open_file_cache          max=2000 inactive=30s;
        open_file_cache_valid    60s;
        open_file_cache_min_uses 2;
    }

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://tc_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }

    # Socket.IO
    include /var/app/game/infra/nginx/snippets/socket-io-proxy.conf;

    # Health check
    location = /health {
        proxy_pass http://tc_api/health;
        proxy_read_timeout 5s;
        access_log off;
    }
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect — admin.tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.tc-gaming.live www.admin.tc-gaming.live;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Admin Dashboard — admin.tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.tc-gaming.live www.admin.tc-gaming.live;

    ssl_certificate     /etc/letsencrypt/live/tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-gaming.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_TC:10m;
    ssl_session_timeout 1d;

    access_log /var/app/game/infra/logs/tc-gaming-admin.access.log combined buffer=16k flush=5s;
    error_log  /var/app/game/infra/logs/tc-gaming-admin.error.log warn;

    limit_conn conn_limit 20;
    limit_req  zone=general_limit burst=40 nodelay;

    client_max_body_size  32M;
    client_body_timeout   15s;
    send_timeout          30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml+rss image/svg+xml font/woff2;

    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-XSS-Protection       "1; mode=block"                always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://tc_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
    }

    # Admin SPA (vite preview)
    location / {
        proxy_pass         http://tc_admin_spa;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
    }

    # Socket.IO
    include /var/app/game/infra/nginx/snippets/socket-io-proxy.conf;
}

# ===========================================================================
# ██████████  MARINA BAY SANDS  (IP: 159.223.81.157)  ████████████████████████
# ===========================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect — IP trực tiếp
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name 159.223.81.157;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — MarinaBaySands via IP + admin.iiit.pro
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 default_server;
    server_name 159.223.81.157 admin.iiit.pro;

    ssl_certificate     /etc/letsencrypt/live/159.223.81.157/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159.223.81.157/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_MBS:10m;
    ssl_session_timeout 1d;

    access_log /var/app/sands/infra/logs/mbs.access.log combined buffer=32k flush=5s;
    error_log  /var/app/sands/infra/logs/mbs.error.log warn;

    limit_conn conn_limit 30;
    limit_req  zone=general_limit burst=80 nodelay;

    client_max_body_size  32M;
    client_body_timeout   15s;
    send_timeout          30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml+rss image/svg+xml font/woff2;

    # Deploy hook (webhook từ GitHub Actions)
    location = /deploy-hook {
        proxy_pass            http://127.0.0.1:9001/deploy-hook;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    310s;
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://mbs_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # File uploads / static media
    location /uploads/ {
        proxy_pass         http://mbs_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /flag/ {
        proxy_pass http://mbs_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (MBS backend)
    location /socket.io/ {
        proxy_pass            http://mbs_api/socket.io/;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # Static asset rewrites → frontend SPA
    location /images/ {
        rewrite ^/images/(.*)$ /app/images/$1 break;
        proxy_pass http://mbs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /all/ {
        rewrite ^/all/(.*)$ /app/all/$1 break;
        proxy_pass http://mbs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sgp/ {
        rewrite ^/sgp/(.*)$ /app/sgp/$1 break;
        proxy_pass http://mbs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/jydticon([0-5])\.png$ {
        rewrite ^/jydticon([0-5])\.png$ /app/sgp/jydticon$1.png redirect;
    }

    location ~ ^/s([1-6])\.png$ {
        rewrite ^/s([1-6])\.png$ /app/sgp/s$1.png redirect;
    }

    # Frontend SPA
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass         http://mbs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Admin SPA
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass         http://mbs_admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Root redirect
    location = / {
        return 301 /app/;
    }
}
