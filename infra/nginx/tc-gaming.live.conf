# TC Gaming — tc-gaming.live  +  admin.tc-gaming.live
# Nginx VPS: 4 CPU / 8 GB RAM
#
# Áp dụng:
#   sudo ln -sf /var/app/game/infra/nginx/tc-gaming.live.conf \
#               /etc/nginx/sites-available/tc-gaming.live
#   sudo ln -sf /etc/nginx/sites-available/tc-gaming.live \
#               /etc/nginx/sites-enabled/tc-gaming.live
#   sudo nginx -t && sudo nginx -s reload

# ---------------------------------------------------------------------------
# Rate-limit zones (khai báo trong http context — đặt ở đây sẽ được include)
# Nếu nginx.conf đã có include sites-enabled, zone này sẽ load đúng 1 lần.
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=general_limit:10m rate=60r/s;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ---------------------------------------------------------------------------
# Upstream backend
# ---------------------------------------------------------------------------
upstream tc_api {
    server 127.0.0.1:8701;
    keepalive 16;
}

upstream tc_admin_spa {
    server 127.0.0.1:8781;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# Frontend Player App — tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tc-gaming.live www.tc-gaming.live;

    root  /var/app/game/apps/frontend-web/dist;
    index index.html;

    access_log /var/app/game/infra/logs/tc-gaming-frontend.access.log combined buffer=32k flush=5s;
    error_log  /var/app/game/infra/logs/tc-gaming-frontend.error.log warn;

    # ---------- Giới hạn kết nối mỗi IP ----------
    limit_conn conn_limit 30;
    limit_req  zone=general_limit burst=80 nodelay;

    # ---------- Kích thước body ----------
    client_max_body_size 32M;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ---------- Gzip ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # ---------- Security headers ----------
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=()" always;

    # ---------- SPA root ----------
    location / {
        limit_req zone=general_limit burst=80 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ---------- index.html: không cache (luôn fresh) ----------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- Static assets: cache 1 năm (immutable) ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        log_not_found off;
        open_file_cache          max=2000 inactive=30s;
        open_file_cache_valid    60s;
        open_file_cache_min_uses 2;
    }

    # ---------- API proxy ----------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://tc_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";        # keepalive
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;

        # Tắt buffering cho streaming response
        proxy_buffering    off;
    }

    # ---------- Socket.IO ----------
    include /var/app/game/infra/nginx/snippets/socket-io-proxy.conf;

    # ---------- Health check (bypass rate limit) ----------
    location = /health {
        proxy_pass http://tc_api/health;
        proxy_read_timeout 5s;
        access_log off;
    }
}

# ---------------------------------------------------------------------------
# Admin Dashboard — admin.tc-gaming.live
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.tc-gaming.live www.admin.tc-gaming.live;

    access_log /var/app/game/infra/logs/tc-gaming-admin.access.log combined buffer=16k flush=5s;
    error_log  /var/app/game/infra/logs/tc-gaming-admin.error.log warn;

    # Admin ít traffic hơn — giới hạn nhẹ hơn
    limit_conn conn_limit 20;
    limit_req  zone=general_limit burst=40 nodelay;

    client_max_body_size 32M;
    client_body_timeout  15s;
    send_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml+rss image/svg+xml font/woff2;

    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header X-XSS-Protection       "1; mode=block"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---------- API proxy ----------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://tc_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_buffering    off;
    }

    # ---------- Admin SPA (vite preview) ----------
    location / {
        proxy_pass         http://tc_admin_spa;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ---------- Socket.IO ----------
    include /var/app/game/infra/nginx/snippets/socket-io-proxy.conf;
}
