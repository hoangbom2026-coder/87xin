# nginx-tuning.conf — Dán (include) vào http { } trong /etc/nginx/nginx.conf
# VPS: 4 CPU / 8 GB RAM
#
# Cách dùng:
#   Thêm dòng này vào /etc/nginx/nginx.conf, bên trong http { ... }:
#       include /var/app/game/infra/nginx/snippets/nginx-tuning.conf;
#
# Hoặc copy nội dung tay vào cuối http block của nginx.conf.

# ---------- Worker ----------
# worker_processes 4;  ← đặt ở ngoài http{}, trong nginx.conf
# worker_rlimit_nofile 65535;

# ---------- Keepalive ----------
keepalive_timeout          65s;
keepalive_requests         1000;

# ---------- Buffers ----------
client_body_buffer_size    128k;
client_header_buffer_size  4k;
large_client_header_buffers 4 16k;
output_buffers             1 32k;
postpone_output            1460;

# ---------- Timeouts ----------
reset_timedout_connection  on;
server_tokens              off;   # Ẩn phiên bản Nginx

# ---------- Open file cache ----------
open_file_cache            max=5000 inactive=60s;
open_file_cache_valid      90s;
open_file_cache_min_uses   2;
open_file_cache_errors     on;
